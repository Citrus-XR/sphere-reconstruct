# sphere-reconstruct runtime 設定. 個別 machine の絶対 path は別 config に置き,
# SPHERE_CONFIG で指定する.

[server]
host = "127.0.0.1"
port = 8787

[workspace]
root = "./workspace"

[filesystem]
# UI file browser が表示できる root. 空なら source browser を禁止する.
allowed_roots = []

[binaries]
# 空文字は PATH から解決する. COLMAP は 4.1 以上が必要.
ffmpeg = ""
ffprobe = ""
colmap = ""
# SIFT sequential loop closure / vocab-tree pairing を使う場合だけ設定する.
vocab_tree = ""

[sam3]
# SAM3 は任意. 使用しない場合は path を空にする.
repo_path = ""
checkpoint_path = ""
config_path = ""
device = "cuda:0"
dtype = "bfloat16"
default_prompt = "person,camera operator,selfie stick,tripod,person shadow,selfie stick shadow,tripod shadow"
max_inference_size = 1024
confidence_threshold = 0.5

[aliked]
# COLMAP native ALIKED model の optional override. 空なら COLMAP が URL+SHA-256 付き
# 既定 model を download/cache する.
extractor_path = ""
matcher_path = ""
# 以下は旧 external ALIKED engine の diagnostic/benchmark 用設定.
device = "cuda"
extraction_device = "auto"
max_extract_size = 0
max_keypoints = 4096
min_score = 0.2

[denoise]
# FastDVDnet checkpoint. 空なら初回実行時に固定 URL から SHA-256 検証付きで取得する.
model_path = ""
device = "auto"
# auto は CUDA/NVDEC を実動画で probe し、同一 RGB 出力を保てる場合に利用する.
hardware_decode = "auto"

[log]
level = "INFO"
