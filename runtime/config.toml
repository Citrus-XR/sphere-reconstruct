# sphere-reconstruct runtime 設定. 個別 machine の絶対 path は別 config に置き,
# SPHERE_CONFIG で指定する.

[server]
host = "127.0.0.1"
port = 8787

[workspace]
root = "./workspace"

[filesystem]
# UI file browser が表示できる root. 空なら source browser を禁止する.
allowed_roots = []

[binaries]
# 空文字は PATH から解決する. COLMAP は 4.1 以上が必要.
ffmpeg = ""
ffprobe = ""
colmap = ""
# Native fisheye の LFStudio 用 lossless crop. 空文字は PATH から検索する.
jpegtran = ""
# SIFT sequential loop closure / vocab-tree pairing を使う場合だけ設定する.
vocab_tree = ""

[frame_extraction]
# auto は CUDA / VideoToolbox / QSV / D3D11VA を実 source の 1 frame で検証して選ぶ.
# hardware decode が必須の専用 machine では require_hwaccel=true にする.
hwaccel = "auto"
require_hwaccel = false
# 0 は candidate score に logical CPU を全て使う.
score_workers = 0

[sam3]
# SAM3 は任意. 使用しない場合は path を空にする.
repo_path = ""
checkpoint_path = ""
config_path = ""
device = "cuda:0"
dtype = "bfloat16"
training_prompt = "person,camera operator,person's shadow"
feature_prompt = "person,camera operator,person's shadow,animal,sky,vehicle,water"
max_inference_size = 2048
confidence_threshold = 0.5

[aliked]
# COLMAP native ALIKED model の optional override. 空なら COLMAP が URL+SHA-256 付き
# 既定 model を download/cache する.
extractor_path = ""
matcher_path = ""
# 以下は旧 external ALIKED engine の diagnostic/benchmark 用設定.
device = "cuda"
extraction_device = "auto"
max_extract_size = 0
max_keypoints = 4096
min_score = 0.2

[log]
level = "INFO"
