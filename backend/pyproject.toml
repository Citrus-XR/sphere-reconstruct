[project]
name = "sphere-reconstruct"
version = "0.0.1"
description = "Insta360 X5 INSV / ERP から COLMAP pinhole rig データセットを生成するローカル Web パイプライン"
requires-python = ">=3.12,<3.14"
readme = "../README.md"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "aiosqlite>=0.20",
    "python-multipart>=0.0.19",
    "typing-extensions>=4.12",
    "tomli>=2.0; python_version < '3.11'",
    "numpy>=2.0",
    "structlog>=24.4",
]

[project.optional-dependencies]
# 重い依存 (Torch, OpenCV, ffmpeg-python, pycolmap) は Worker 側だけで使いたいので後段で分割する.
# Phase 4 以降で torch を extra として追加予定.
imaging = [
    "opencv-python-headless>=4.10",
    "Pillow>=11.0",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sphere_reconstruct"]

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = ["dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
