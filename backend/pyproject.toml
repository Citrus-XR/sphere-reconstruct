[project]
name = "sphere-reconstruct"
version = "0.0.1"
description = "Insta360 X5 INSV / ERP から COLMAP pinhole rig データセットを生成するローカル Web パイプライン"
requires-python = ">=3.12,<3.14"
readme = "../README.md"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "aiosqlite>=0.20",
    "python-multipart>=0.0.19",
    "typing-extensions>=4.12",
    "tomli>=2.0; python_version < '3.11'",
    "numpy>=2.0",
    "structlog>=24.4",
]

[project.optional-dependencies]
# 重い依存は Worker 側だけで使うため extra に分離する.
# base の `uv sync` では入らない. CUDA が要る機だけ `--extra sam3` を付ける.
imaging = [
    "opencv-python-headless>=4.10",
    "Pillow>=11.0",
]
# SAM3 推論. torch は cu128 index から. sam3 パッケージ本体は sys.path 経由で
# import するので, ここではその実行時依存だけを入れる.
# SAM3 推論. torch は cu128 index から. sam3 パッケージ本体は sys.path 経由で
# import するので, ここではその実行時依存を入れる. sam3 の pyproject が宣言する
# 依存は不完全で, model_builder が tracker / train パスを無条件 import するため
# einops / decord / triton / pandas / scipy 等まで必要になる (実機で確認済み).
sam3 = [
    "torch>=2.5",
    "torchvision>=0.20",
    "timm>=1.0.17",
    "einops>=0.8",
    "decord>=0.6",
    "ftfy",
    "regex",
    "iopath>=0.1.10",
    "huggingface-hub",
    "Pillow>=11.0",
    "opencv-python-headless>=4.10",
    "pandas",
    "scipy",
    "scikit-image",
    "scikit-learn",
    "pycocotools",
    "torchmetrics",
    "submitit",
    "matplotlib",
    "psutil",
    "omegaconf",
    "hydra-core",
    "open-clip-torch",
    # triton は Windows では triton-windows パッケージ. Linux は torch 同梱の triton.
    "triton-windows; sys_platform == 'win32'",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "httpx>=0.28",
]
# ALIKED + LightGlue の ONNX 特徴 backend. CUDA 機で onnxruntime-gpu を使う.
aliked = [
    "onnxruntime-gpu>=1.19; sys_platform != 'darwin'",
    "onnxruntime>=1.19; sys_platform == 'darwin'",
    "opencv-python-headless>=4.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sphere_reconstruct"]

[tool.uv]
package = true

# torch は CUDA 12.8 ビルドを明示 index から取る (Windows/Linux + NVIDIA).
# CUDA の無い機では --extra sam3 を付けなければ torch は入らない.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = ["dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
