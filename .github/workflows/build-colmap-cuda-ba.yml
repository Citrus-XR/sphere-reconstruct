name: Build COLMAP CUDA BA runtime

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-runtime:
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      CUDA_MAJOR_VERSION: "12"
      CUDA_MINOR_VERSION: "8"
      CUDA_PATCH_VERSION: "1"
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-binary-cache
      SPHERE_NATIVE_DOWNLOAD_CACHE: ${{ github.workspace }}\native-download-cache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Install CUDA toolchain
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: ${{ env.CUDA_MAJOR_VERSION }}.${{ env.CUDA_MINOR_VERSION }}.${{ env.CUDA_PATCH_VERSION }}
          sub-packages: '["nvcc", "thrust", "nvtx", "cudart", "curand", "curand_dev", "nvrtc", "nvrtc_dev", "nvjitlink", "cufft", "cublas", "cublas_dev", "cusolver", "cusolver_dev", "cusparse", "cusparse_dev"]'
          method: network

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "4.1.0"
          ninjaVersion: "1.12.1"

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: vcpkg-binary-cache
          key: vcpkg-6d9d7df564a1ccdaa994e4ad39ccd4a32360867b-x64-windows-release-v1

      - name: Restore native download cache
        id: native-download-cache
        uses: actions/cache/restore@v4
        with:
          path: native-download-cache
          key: native-downloads-cuda-12.8.1-cudnn-9.20.0.48-cudss-0.8.0.10

      - name: Enable compiler cache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Enter Visual Studio environment and build
        id: build
        continue-on-error: true
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module "$installation/Common7/Tools/Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $installation -SkipAutomaticLocation -DevCmdArguments "-arch=x64 -host_arch=x64"
          ./scripts/build_colmap_cuda_ba.ps1 -OutputDirectory "${{ github.workspace }}/dist"

      - name: Save vcpkg binary cache
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: vcpkg-binary-cache
          key: vcpkg-6d9d7df564a1ccdaa994e4ad39ccd4a32360867b-x64-windows-release-v1

      - name: Save native download cache
        if: always() && steps.native-download-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: native-download-cache
          key: native-downloads-cuda-12.8.1-cudnn-9.20.0.48-cudss-0.8.0.10

      - name: Propagate build failure
        if: steps.build.outcome == 'failure'
        shell: pwsh
        run: throw "COLMAP CUDA BA runtime build failed"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: colmap-4.1.1-x64-windows-cuda-ba
          path: dist/*

  validate-runtime:
    needs: windows-runtime
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: colmap-4.1.1-x64-windows-cuda-ba
          path: dist

      - name: Validate on a clean Windows runner
        shell: pwsh
        run: |
          Expand-Archive `
            "dist/colmap-4.1.1-x64-windows-cuda-ba.zip" `
            "${{ runner.temp }}/colmap-runtime"
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module "$installation/Common7/Tools/Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $installation -SkipAutomaticLocation -DevCmdArguments "-arch=x64 -host_arch=x64"
          ./scripts/test_colmap_runtime.ps1 -InstallRoot "${{ runner.temp }}/colmap-runtime"

  publish-runtime:
    needs: validate-runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: colmap-4.1.1-x64-windows-cuda-ba
          path: dist

      - name: Publish pinned runtime release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: runtime-colmap-4.1.1-cuda-ba-v1
          name: COLMAP 4.1.1 CUDA BA runtime v1
          prerelease: true
          body: |
            COLMAP 4.1.1 CLI runtime built with Ceres 2.3.0-dev at
            bac1127f9ef672405bd0d2d9c84e809ae89bd239, CUDA 12.8, and cuDSS 0.8.0.10.
            Includes the minimal sequential rig-pairing fix from COLMAP PR 4591.
            The archive is intended for sphere-reconstruct's pinned Windows installer.
          files: |
            dist/colmap-4.1.1-x64-windows-cuda-ba.zip
            dist/colmap-4.1.1-x64-windows-cuda-ba.zip.sha256
